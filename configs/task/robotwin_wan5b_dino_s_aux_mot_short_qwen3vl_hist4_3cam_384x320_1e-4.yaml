# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam_wan5b_dino_s_aux_mot_short_qwen3vl_hist4
  - _self_

# RoboTwin version of the LIBERO Qwen3VL-hist4 mainline: keep the Wan5B
# VAE/RGB, DINO-S auxiliary, and action three-branch MoT, and add Qwen current
# semantics fused with four DINO history frames for the action branch only.
batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [384, 320]
    latent_spatial_pool: [1, 1]
    encode_microbatch_size: 4
    load_backbone: true
  semantic_history_config:
    history_offsets: [-24, -16, -8, -1]
    max_history_frames: 4
    processor_max_pixels: 100352

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null

data:
  train:
    video_size: [384, 320]
    concat_multi_camera: "robotwin"
    val_set_proportion: 0.0
    load_text_context: true
    load_semantic_image: true
    semantic_frame_offset: 0
    dino_latent_cache_dir: null
    dino_latent_cache_mode: frame_mmap
    dino_latent_cache_required: false
    load_history_dino_latents: false
    load_history_dino_video: true
    history_dino_frame_offsets: [-24, -16, -8, -1]
    history_dino_latent_cache_required: false
  val: null
