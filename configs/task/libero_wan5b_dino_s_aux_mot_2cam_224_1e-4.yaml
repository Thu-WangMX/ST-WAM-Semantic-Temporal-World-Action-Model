# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_wan5b_dino_s_aux_mot
  - _self_

# Wan5B VAE/RGB + 1B DINO-S auxiliary three-branch MoT is heavier than the pure 1B DINO/VAE runs.
# Keep per-GPU batch conservative by default; override on H200/AMD if memory allows.
batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [224, 448]
    latent_spatial_pool: [1, 1]
    encode_microbatch_size: 16

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null

data:
  train:
    video_size: [224, 448]
    concat_multi_camera: "horizontal"
    load_text_context: true
    dino_latent_cache_dir: null
    dino_latent_cache_mode: frame
    dino_latent_cache_required: false
