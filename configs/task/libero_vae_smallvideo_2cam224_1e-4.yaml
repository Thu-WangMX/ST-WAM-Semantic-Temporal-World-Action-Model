# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_smallvideo
  - _self_

# VAE latent + small WanVideoDiT baseline. This matches DINO-small/ActionDiT
# transformer dimensions while keeping Wan VAE latent supervision.
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

wandb:
  name: libero_vae_smallvideo_2cam224
