# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_wan5b_dino_s_aux_mot_short_qwen3vl_current
  - _self_

# Wan5B VAE/RGB + DINO-S 3-MoT, plus Qwen3-VL current semantics injected only
# into the action branch. No history memory is loaded for this control.
batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [224, 448]
    latent_spatial_pool: [1, 1]
    encode_microbatch_size: 16

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 16
weight_decay: 1e-2
resume: null

data:
  train:
    video_size: [224, 448]
    concat_multi_camera: "horizontal"
    load_text_context: true
    load_semantic_image: true
    semantic_frame_offset: 0
    vae_latent_cache_dir: ./data/vae_latents_cache/libero_wan22vae38_2cam224_window_mmap
    vae_latent_cache_mode: window_mmap
    vae_latent_cache_required: true
    skip_video_load_if_latent_cached: true
    dino_latent_cache_dir: ./data/dino_latents_cache/libero_dino_s_2cam224_pool1x1_frame_exact_mmap
    dino_latent_cache_mode: frame_mmap
    dino_latent_cache_required: true
