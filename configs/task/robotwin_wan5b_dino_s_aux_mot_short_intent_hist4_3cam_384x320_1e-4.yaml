# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam_wan5b_dino_s_aux_mot_short_intent_hist4
  - _self_

# Wan5B VAE/RGB + DINO-S auxiliary three-branch MoT with 4-frame
# Short-DINO-Intent on RoboTwin's 3-camera top+dual-wrist layout. By default
# this task does not require a precomputed DINO cache: the main DINO branch and
# the history DINO-intent path are encoded online from RGB with the DINO-S
# backbone. If a frame_mmap cache is available, it can still be enabled by
# overriding the data.train.dino_latent_cache_* fields and load_history flags.
batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [384, 320]
    latent_spatial_pool: [1, 1]
    encode_microbatch_size: 4
    load_backbone: true
  intent_config:
    source: dino
    history_offsets: [-24, -16, -8, -1]
    max_history_frames: 4

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 12
weight_decay: 1e-2
resume: null

data:
  train:
    video_size: [384, 320]
    concat_multi_camera: "robotwin"
    val_set_proportion: 0.0
    load_text_context: true
    dino_latent_cache_dir: null
    dino_latent_cache_mode: frame_mmap
    dino_latent_cache_required: false
    load_history_dino_latents: false
    load_history_dino_video: true
    history_dino_frame_offsets: [-24, -16, -8, -1]
    history_dino_latent_cache_required: false
  val: null
