# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam_wan5b_dino_s_aux_mot_short_intent
  - _self_

# Wan5B VAE/RGB + DINO-S auxiliary three-branch MoT with Short-DINO-Intent on
# RoboTwin.  Training consumes a frame_mmap DINO cache so the intent history
# path is shape-identical to the LIBERO short-intent setup.
batch_size: 1
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [384, 320]
    latent_spatial_pool: [1, 1]
    encode_microbatch_size: 8
    load_backbone: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 12
weight_decay: 1e-2
resume: null

data:
  train:
    video_size: [384, 320]
    concat_multi_camera: "robotwin"
    val_set_proportion: 0.0
    load_text_context: true
    dino_latent_cache_dir: ./data/dino_latents_cache/robotwin_dino_s_3cam384x320_pool1x1_frame_mmap
    dino_latent_cache_mode: frame_mmap
    dino_latent_cache_required: true
    load_history_dino_latents: true
    history_dino_frame_offsets: [-8, -4, 0]
    history_dino_latent_cache_required: true
  val: null
