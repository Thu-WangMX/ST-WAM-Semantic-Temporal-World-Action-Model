# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
prefetch_factor: 2
persistent_workers: false
pin_memory: true

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
safe_checkpoint_serialization: false
save_accelerate_state: true
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# Optional offline DINO latent precompute. These are consumed by
# scripts/precompute_dino_latents.py; normal training ignores them unless
# data.train.dino_latent_cache_dir is also set.
dino_latent_cache_dir: null
dino_latent_cache_mode: window  # window, frame, or frame_mmap
dino_precompute_batch_size: 8
dino_precompute_num_workers: 8
dino_latent_cache_dtype: bf16
overwrite: false

# Optional offline Wan VAE latent precompute. These are consumed by
# scripts/precompute_vae_latents.py and by latent-only training configs.
vae_latent_cache_dir: null
vae_latent_cache_mode: window_mmap
vae_precompute_batch_size: 4
vae_precompute_num_workers: 8
vae_latent_cache_dtype: bf16

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
