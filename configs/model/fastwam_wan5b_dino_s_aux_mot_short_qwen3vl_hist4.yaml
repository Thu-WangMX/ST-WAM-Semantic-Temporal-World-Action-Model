_target_: fastwam.runtime.create_fastwam_vae_dino_mot
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
# Keep the VAE/RGB latent branch as the native Wan2.2-5B FastWAM world model.
# Leave this null so `load_wan22_ti2v_5b_components()` loads the original Wan
# video DiT instead of the 1B smallvideo-interpolated checkpoint.
vae_video_dit_pretrained_path: null
dino_video_dit_pretrained_path: checkpoints/DinoVideoDiT_smallvideo_from_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Three-branch MoT + Qwen current semantic / 4-history DINO action-only adapter.
# Video and DINO branches keep the base 3-MoT context; only the action branch
# receives Qwen-conditioned short-history semantic tokens.
vae_video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

dino_config:
  model_name: "dinov3-vits16-timm"
  model_path: "checkpoints/dinov3_weights/dinov3_vits16_timm_lvd1689m.safetensors"
  input_resolution: [224, 224]
  patch_size: 16
  feature_dim: 384
  use_cls_token: false
  normalize_features: false
  encode_microbatch_size: 144
  load_backbone: true

dino_video_dit_config:
  hidden_dim: 1024
  ffn_dim: 4096
  freq_dim: 256
  text_dim: 4096
  eps: 1.0e-06
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  video_attention_mask_mode: "first_frame_causal"
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  latent_patch_size: [1, 1, 1]
  latent_patch_mode: "flat"
  latent_num_views: 1

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

semantic_history_config:
  enabled: true
  injection_mode: action_context_after_proprio
  vlm_family: qwen3_vl
  vlm_model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  freeze_vlm: true
  # Keep Qwen image token count controlled for the first LIBERO ablation.
  processor_min_pixels: null
  processor_max_pixels: 100352
  history_offsets: [-24, -16, -8, -1]
  max_history_frames: 4
  num_output_tokens: 8
  resampler_dim: 1024
  num_resampler_layers: 2
  num_heads: 8
  dropout: 0.0

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_dino: 0.02
  lambda_action: 1.0
