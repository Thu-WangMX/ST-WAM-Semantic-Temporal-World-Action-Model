_target_: fastwam.runtime.create_fastwam_semantic_history
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Frozen DINO features are used only to encode recent history for the Qwen
# action adapter. This model has no DINO future expert or DINO future loss.
dino_config:
  model_name: "dinov3-vits16-timm"
  model_path: "checkpoints/dinov3_weights/dinov3_vits16_timm_lvd1689m.safetensors"
  input_resolution: [224, 224]
  patch_size: 16
  feature_dim: 384
  use_cls_token: false
  normalize_features: false
  encode_microbatch_size: 144
  load_backbone: true

semantic_history_config:
  enabled: true
  use_history: true
  injection_mode: action_context_after_proprio
  vlm_family: qwen3_vl
  vlm_model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  freeze_vlm: true
  processor_min_pixels: null
  processor_max_pixels: 100352
  history_offsets: [-24, -16, -8, -1]
  max_history_frames: 4
  num_output_tokens: 8
  resampler_dim: 1024
  num_resampler_layers: 2
  num_heads: 8
  dropout: 0.0

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
