_target_: fastwam.runtime.create_fastwam_dino
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# Optional: initialize DinoVideoDiT Transformer layers from Wan2.2 Video DiT.
# Keep false for the first DINO-S ablation to reduce moving parts.
video_dit_init_from_wan: false
wan_model_id: "Wan-AI/Wan2.2-TI2V-5B"

# DINO encoder config (frozen) -- DINOv3-ViT-S/16 from public timm weights.
dino_config:
  model_name: "dinov3-vits16-timm"
  model_path: "checkpoints/dinov3_weights/dinov3_vits16_timm_lvd1689m.safetensors"
  input_resolution: [224, 224]
  patch_size: 16
  feature_dim: 384
  use_cls_token: false
  normalize_features: false
  encode_microbatch_size: 144
  load_backbone: true

# Keep the DiT/MoT capacity identical to the DINO-L config for an encoder-only ablation.
video_dit_config:
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  eps: 1.0e-06
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  video_attention_mask_mode: "first_frame_causal"
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
