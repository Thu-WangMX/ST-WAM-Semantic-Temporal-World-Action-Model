_target_: fastwam.runtime.create_fastwam_dino
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

# DINO-S small-video ablation:
# - Keep ActionDiT at the original 1B shape so the ActionDiT pretrained payload still loads.
# - Shrink only DinoVideoDiT from Wan2.2-5B shape to ActionDiT-scale hidden/FFN dims.
# - Keep num_heads/attn_head_dim/num_layers matched with ActionDiT for MoT mixed attention.
video_dit_init_from_wan: false
video_dit_pretrained_path: checkpoints/DinoVideoDiT_smallvideo_from_Wan22_alphascale_1024hdim.pt
wan_model_id: "Wan-AI/Wan2.2-TI2V-5B"

dino_config:
  model_name: "dinov3-vits16-timm"
  model_path: "checkpoints/dinov3_weights/dinov3_vits16_timm_lvd1689m.safetensors"
  input_resolution: [224, 224]
  patch_size: 16
  feature_dim: 384
  use_cls_token: false
  normalize_features: false
  encode_microbatch_size: 144
  load_backbone: true

video_dit_config:
  hidden_dim: 1024
  ffn_dim: 4096
  freq_dim: 256
  text_dim: 4096
  eps: 1.0e-06
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  video_attention_mask_mode: "first_frame_causal"
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  # Optional learnable DINO token merge inside DinoVideoDiT.
  # Keep [1,1,1] for current behavior. Use [1,1,2] to turn 14x28 no-pool
  # DINO tokens into 14x14 learned patch tokens while still predicting the
  # original no-pool DINO velocity target.
  latent_patch_size: [1, 1, 1]
  latent_patch_mode: "flat"  # "flat" treats 14x28 as one grid; "view" splits width into latent_num_views.
  latent_num_views: 1

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0
